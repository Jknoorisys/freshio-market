<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ============================================ -->
    <!-- PWA & App Meta Tags                         -->
    <!-- ============================================ -->

    <!-- Mobile viewport: disables browser chrome on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (status bar on Android Chrome) -->
    <meta name="theme-color" content="#2D9B51" />
    <meta name="msapplication-TileColor" content="#2D9B51" />

    <!-- App favicon -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon.png" />

    <!-- ============================================ -->
    <!-- Apple Web App (iOS) PWA Support             -->
    <!-- ============================================ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Freshio" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ============================================ -->
    <!-- SEO Meta Tags                               -->
    <!-- ============================================ -->
    <meta name="description" content="Kigali's Fresh Choice – Shop 4,600+ Sawa Citi groceries and get them delivered to your door in 2 hours." />
    <meta name="keywords" content="Freshio, Kigali groceries, Sawa Citi, Rwanda supermarket, online grocery delivery" />
    <meta name="author" content="Freshio Market" />

    <!-- Open Graph (WhatsApp / social sharing previews) -->
    <meta property="og:title" content="Freshio Market – Kigali's Fresh Choice" />
    <meta property="og:description" content="Shop 4,600+ Sawa Citi supermarket products and get delivery in 2 hours across Kigali." />
    <meta property="og:image" content="/icon.png" />
    <meta property="og:type" content="website" />

    <!-- ============================================ -->
    <!-- Fonts                                       -->
    <!-- ============================================ -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

    <title>Freshio Market – Kigali's Fresh Choice</title>

    <style>
      /* Prevent mobile browser bounce scroll & address bar bleed */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      /* iOS safe area support for notch & home indicator */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* Splash/loading screen before React mounts */
      #app-splash {
        position: fixed;
        inset: 0;
        background: #2D9B51;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease;
      }
      #app-splash img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: white;
        padding: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        animation: splashBounce 0.8s ease infinite alternate;
      }
      #app-splash p {
        color: white;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 18px;
        margin-top: 20px;
        letter-spacing: 0.5px;
      }
      #app-splash span {
        color: rgba(255,255,255,0.7);
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 12px;
        margin-top: 6px;
      }
      @keyframes splashBounce {
        from { transform: translateY(0px); }
        to { transform: translateY(-8px); }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen shown before React mounts -->
    <div id="app-splash">
      <img src="/icon.png" alt="Freshio" />
      <p>Freshio Market</p>
      <span>Kigali's Fresh Choice</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration + Hide splash on load -->
    <script>
      // Hide splash screen once React app has mounted
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('app-splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 400);
          }
        }, 800);
      });

      // Register Service Worker for PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[Freshio PWA] Service Worker registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('[Freshio PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
